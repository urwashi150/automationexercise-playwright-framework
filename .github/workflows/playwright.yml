name: UI Playwright Tests

on:
  push:
    branches: [main, configs]
  pull_request:
    branches: [main, configs]
  schedule:
    - cron: '0 3 * * *' # nightly regression run
  workflow_dispatch: {}

jobs:
  ui:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1/3, 2/3, 3/3]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run UI tests (sharded)
        run: npx playwright test tests/ui --shard=${{ matrix.shard }}
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ui-report-${{ strategy.job-index }}
          path: playwright-report/
          retention-days: 14

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-ui-results-${{ strategy.job-index }}
          path: test-results/junit.xml
          retention-days: 14
